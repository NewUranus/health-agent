groups:
  - name: healthpilot
    rules:
      - alert: HealthPilotWorkerUnavailable
        expr: healthpilot_workers == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HealthPilot 无有效 Worker 心跳"
      - alert: HealthPilotQueueDelayed
        expr: healthpilot_queue_oldest_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HealthPilot 队列等待超过一分钟"
      - alert: HealthPilotStaleTask
        expr: healthpilot_stale_tasks > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "HealthPilot 存在租约过期任务"
      - alert: HealthPilotTelemetryExportFailed
        expr: healthpilot_otel_export_unavailable > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HealthPilot OTLP 导出持续失败"
      - alert: HealthPilotCollectorQueueGrowing
        expr: otelcol_exporter_queue_size / otelcol_exporter_queue_capacity > 0.7
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "OpenTelemetry Collector 持久队列使用率超过70%"
      - alert: HealthPilotCollectorRejected
        expr: increase(otelcol_receiver_refused_log_records_total[5m]) > 0 or increase(otelcol_receiver_refused_spans_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "OpenTelemetry Collector 拒收遥测数据"
      - alert: HealthPilotTelemetryBackendDown
        expr: up{job=~"otel-collector|loki|tempo"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "可观测性服务不可达"
