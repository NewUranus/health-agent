extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/queue
    create_directory: true
    fsync: true
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    sending_queue:
      storage: file_storage
      queue_size: 10000
      num_consumers: 4
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      storage: file_storage
      queue_size: 10000
      num_consumers: 4
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: warn
      encoding: json
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    # 应用 SDK 已批处理；采集器直接入持久队列，避免先确认再留在内存批次。
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlphttp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlphttp/loki]
