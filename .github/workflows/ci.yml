name: HealthPilot 验收
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HEALTH_AGENT_MOCK: "1"
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run python -m eval.run_eval --mock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # web/ 是提交进仓库的构建结果，必须和源码一致
      - run: git diff --exit-code -- web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 评测结果
          path: eval/results/*.json

  publish-image:
    name: 构建并发布部署镜像
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 确定镜像版本
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: 准备构建器
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: 登录 GitHub 镜像仓库
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建镜像并复用依赖缓存
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=healthpilot-amd64
          cache-to: type=gha,mode=max,scope=healthpilot-amd64
      - name: 验证镜像可以启动
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --detach --name healthpilot-smoke --env HEALTH_AGENT_MOCK=1 "$IMAGE"
          for attempt in $(seq 1 20); do
            if docker exec healthpilot-smoke python -c 'import json, urllib.request; result = json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)); assert result.get("ok") is True and result.get("mock") is True'; then
              exit 0
            fi
            sleep 3
          done
          docker logs --tail=100 healthpilot-smoke
          exit 1
      - name: 发布已验证镜像
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE"
          printf '部署镜像：`%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: 清理验证容器
        if: always()
        run: docker rm --force healthpilot-smoke || true
