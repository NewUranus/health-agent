name: HealthPilot 验收
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  changes:
    name: 判断是否需要构建
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 按整次推送或 PR 的变更范围判断
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # 手动运行或无法确定变更范围时保留完整检查。
          code=true
          base="$PUSH_BASE"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          fi
          if [[ "$EVENT_NAME" != workflow_dispatch && "$base" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            paths=$(mktemp)
            if git diff --name-only -z "$base" HEAD > "$paths"; then
              code=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  README.md|ACCEPTANCE_MATRIX.md|docs/*|ops/README.md|ops/OBSERVABILITY.md) ;;
                  *) code=true; break ;;
                esac
              done < "$paths"
            fi
            rm -f "$paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" == false ]]; then
            echo '仅说明文档或文档截图变化，跳过测试与镜像发布；应用仍使用此前已发布的版本。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '包含程序、依赖或部署配置变化，执行有超时限制的完整检查。' >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      HEALTH_AGENT_MOCK: "1"
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
        timeout-minutes: 3
      - name: 自动部署边界检查
        run: python -m unittest verification/test_ci_deploy.py -v
      - name: 后端检查（失败即停，最多五分钟）
        timeout-minutes: 6
        run: timeout --signal=TERM --kill-after=15s 5m uv run pytest -x -vv -ra -o faulthandler_timeout=60
      - run: uv run python -m eval.run_eval --mock
        timeout-minutes: 3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        timeout-minutes: 3
        working-directory: frontend
      - run: npm test
        timeout-minutes: 3
        working-directory: frontend
      - run: npm run build
        timeout-minutes: 3
        working-directory: frontend
      # web/ 是提交进仓库的构建结果，必须和源码一致
      - run: git diff --exit-code -- web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 评测结果
          path: eval/results/*.json

  publish-image:
    name: 构建并发布部署镜像
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 确定镜像版本
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: 准备构建器
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: 登录 GitHub 镜像仓库
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建镜像并复用依赖缓存
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=healthpilot-amd64
          cache-to: type=gha,mode=max,scope=healthpilot-amd64
      - name: 验证镜像可以启动
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --detach --name healthpilot-smoke --env HEALTH_AGENT_MOCK=1 "$IMAGE"
          for attempt in $(seq 1 20); do
            if docker exec healthpilot-smoke python -c 'import json, urllib.request; result = json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)); assert result.get("ok") is True and result.get("mock") is True'; then
              exit 0
            fi
            sleep 3
          done
          docker logs --tail=100 healthpilot-smoke
          exit 1
      - name: 发布已验证镜像
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE"
          printf '部署镜像：`%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: 清理验证容器
        if: always()
        run: docker rm --force healthpilot-smoke || true

  deploy:
    name: 部署到演示服务器
    needs: publish-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.HEALTHPILOT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    concurrency:
      group: healthpilot-production
      # 不在更新容器时取消部署；服务器还会拒绝旧提交覆盖新版本。
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.HEALTHPILOT_DEPLOY_HOST }}
    steps:
      - name: 配置部署专用 SSH 凭证
        env:
          DEPLOY_KEY: ${{ secrets.HEALTHPILOT_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HEALTHPILOT_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo '缺少部署主机或 SSH Secrets。' >&2; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/healthpilot-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/healthpilot-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/healthpilot-ssh/known_hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/healthpilot-ssh/key" >/dev/null
      - name: 部署本次已发布的提交
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-z_][a-z0-9_-]*@[a-zA-Z0-9.-]+$ ]] || { echo '部署主机格式无效。' >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          ssh -T -F /dev/null -i "$RUNNER_TEMP/healthpilot-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/healthpilot-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$DEPLOY_HOST" "deploy $GITHUB_SHA"
          printf '部署请求已完成，提交：`%s`。具体部署或跳过原因见日志。\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: 清理临时 SSH 凭证
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/healthpilot-ssh"
