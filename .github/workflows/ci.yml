name: HealthPilot 验收
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HEALTH_AGENT_MOCK: "1"
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run python -m eval.run_eval --mock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # web/ 是提交进仓库的构建结果，必须和源码一致
      - run: git diff --exit-code -- web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 评测结果
          path: eval/results/*.json
