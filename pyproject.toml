[project]
name = "health-agent"
version = "0.1.0"
description = "HealthPilot：心血管健康评估 Agent 演示（LangGraph + MCP + RAG）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "mcp>=2",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    "python-dotenv>=1.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
